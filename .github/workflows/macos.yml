# Construit HA Taskbar pour macOS sur un Mac de GitHub, a chaque modification du dossier macos/.
# L'application (.zip et .dmg) est disponible dans les « Artifacts » de l'execution.
#
# Publication : Actions -> macOS -> Run workflow, avec le tag d'une release existante (ex. v1.8.0).
# Le .dmg et le .zip sont ajoutes a cette release, et une section macOS est ajoutee a ses notes.
name: macOS

on:
  push:
    paths:
      - "macos/**"
      - "assets/ha_taskbar.png"
      - ".github/workflows/macos.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release ou ajouter l'application Mac (ex. v1.8.0). Vide = construire seulement."
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Construction
        run: ./macos/build.sh
      - name: Test de l'interface (clic, appui long, carte)
        run: ./macos/Tests/ui-test.sh macos/dist/ui-test
      - name: Test de l'installation et de la mise a jour automatique
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./macos/Tests/update-test.sh macos/dist/update-test
      - name: Captures du test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-interface
          path: macos/dist/ui-test/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: HATaskbar-macOS
          path: |
            macos/dist/*.zip
            macos/dist/*.dmg

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HATaskbar-macOS
          path: dist
      - name: Verification de la version
        run: |
          VERSION=$(sed -n 's/^let appVersion = "\(.*\)"/\1/p' macos/Sources/HATaskbar/Version.swift)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::La version Mac ($VERSION) ne correspond pas au tag $TAG"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -l dist
      - name: Ajout des fichiers a la release
        run: gh release upload "$TAG" dist/HATaskbar-macOS-*.dmg dist/HATaskbar-macOS-*.zip --clobber
      - name: Empreintes (SHA256SUMS.txt) et notes de la release
        run: |
          gh release view "$TAG" --json body --jq .body > body.md
          DMG_SHA=$(sha256sum "dist/HATaskbar-macOS-$VERSION.dmg" | cut -d' ' -f1)
          ZIP_SHA=$(sha256sum "dist/HATaskbar-macOS-$VERSION.zip" | cut -d' ' -f1)
          # SHA256SUMS.txt : les lignes des fichiers Mac sont remplacees, celles de Windows gardees
          gh release download "$TAG" -p SHA256SUMS.txt -D sums 2>/dev/null || true
          touch sums/SHA256SUMS.txt
          grep -v "HATaskbar-macOS-" sums/SHA256SUMS.txt > SHA256SUMS.txt || true
          echo "$DMG_SHA  HATaskbar-macOS-$VERSION.dmg" >> SHA256SUMS.txt
          echo "$ZIP_SHA  HATaskbar-macOS-$VERSION.zip" >> SHA256SUMS.txt
          sort -k2 SHA256SUMS.txt -o SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          NOTES="macos/notes/$TAG.md"
          python3 - "$VERSION" "$DMG_SHA" "$ZIP_SHA" "$NOTES" <<'PY'
          import os, re, sys
          version, dmg, zip_, notes = sys.argv[1:5]
          body = open("body.md", encoding="utf-8").read()
          # 1. empreintes des fichiers Mac, ou qu'elles soient dans les notes
          for name, h in ((f"HATaskbar-macOS-{version}.dmg", dmg), (f"HATaskbar-macOS-{version}.zip", zip_)):
              body = re.sub(r"(`" + re.escape(name) + r"`[^`\n]*`)[0-9a-f]{64}(`)", lambda m: m.group(1) + h + m.group(2), body)
          # 2. paragraphes macOS : macos/notes/<tag>.md contient le francais, puis une ligne « ---en--- », puis l'anglais
          if os.path.exists(notes):
              fr, _, en = open(notes, encoding="utf-8").read().partition("---en---")
              fr, en = fr.strip(), en.strip()
              # francais : de « **🍎 macOS** » jusqu'a la ligne vide suivante
              body, n = re.subn(r"\*\*🍎 macOS\*\*.*?(?=\n\n)", lambda m: fr, body, count=1, flags=re.S)
              if not n:
                  body = fr + "\n\n" + body
              # anglais : la ligne « - Mac: ... »
              if en:
                  body, n = re.subn(r"^- Mac:.*$", lambda m: en, body, count=1, flags=re.M)
          open("body.md", "w", encoding="utf-8").write(body)
          PY
          gh release edit "$TAG" --notes-file body.md
          gh release view "$TAG" --json assets --jq '.assets[].name'
