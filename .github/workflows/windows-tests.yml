# Tests de la version Windows (chiffrement du jeton avec DPAPI).
name: Windows (tests)

on:
  push:
    paths:
      - "*.py"
      - "tests/**"
      - ".github/workflows/windows-tests.yml"
  workflow_dispatch:
    inputs:
      commit:
        description: "Envoyer les captures des widgets sur la branche"
        type: boolean
        default: false

jobs:
  tests:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chiffrement du jeton
        run: python tests/test_token.py
      - name: Compilation de tous les modules
        run: python -m py_compile ha_core.py ha_taskbar.py settings_ui.py card_ui.py tray.py palette.py ha_ws.py tooltip_ui.py update_ui.py screens.py anim_icons.py ui_theme.py widgets_ui.py history.py
      - name: Widgets de bureau (apercu et capture)
        run: |
          python -m pip install -q pillow
          mkdir shots
          python tests/widgets_preview.py shots
      - name: Programme complet (barre, mini-graphique, widgets)
        run: python tests/app_smoke.py shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widgets-windows
          path: shots/*.png
      - name: Envoi des captures sur la branche
        if: github.event_name == 'workflow_dispatch' && inputs.commit && github.ref_name != 'main'
        shell: bash
        run: |
          mkdir -p docs/screenshots/windows-brut
          cp shots/*.png docs/screenshots/windows-brut/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/windows-brut
          git commit -m "Captures Windows brutes (a recadrer)"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
