# Captures d'ecran de la version macOS pour le README (donnees de demonstration).
# Lancement : Actions -> macOS (captures) -> Run workflow. Les images sont dans les Artifacts.
name: macOS (captures)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/macos-screenshots.yml"

jobs:
  screenshots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction
        run: ./macos/build.sh --native
      - name: Captures
        run: |
          APP="macos/dist/HA Taskbar.app/Contents/MacOS/HATaskbar"
          mkdir -p shots
          system_profiler SPDisplaysDataType | grep -i resolution || true
          appearance() {
            osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $1" || true
            sleep 2
          }
          shoot() {
            name=$1; shift
            "$APP" --demo "$@" &
            pid=$!
            sleep 7
            screencapture -x "shots/$name.png" || true
            kill $pid || true
            sleep 2
          }
          for mode in clair sombre; do
            if [ $mode = clair ]; then appearance false; else appearance true; fi
            shoot "barre-$mode"
            shoot "carte-lumiere-$mode" --demo-card 0
            shoot "carte-thermostat-$mode" --demo-card 2
            shoot "carte-capteur-$mode" --demo-card 3
            shoot "reglages-$mode" --demo-settings items
            shoot "ajout-$mode" --demo-picker
          done
          ls -l shots
      - uses: actions/upload-artifact@v4
        with:
          name: captures-macos
          path: shots/*.png
