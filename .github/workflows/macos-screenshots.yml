# Captures d'ecran de la version macOS pour le README (donnees de demonstration).
# Lancement : Actions -> macOS (captures) -> Run workflow. Les images sont dans les Artifacts.
name: macOS (captures)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Envoyer les captures brutes sur la branche (docs/screenshots/macos-brut)"
        type: boolean
        default: false
      gifs:
        description: "Seulement les series d'images pour les GIF (animations)"
        type: boolean
        default: false

jobs:
  screenshots:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Construction
        run: ./macos/build.sh --native
      - name: Captures
        run: |
          APP="macos/dist/HA Taskbar.app/Contents/MacOS/HATaskbar"
          mkdir -p shots
          system_profiler SPDisplaysDataType | grep -i resolution || true
          appearance() {
            osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $1" || true
            sleep 2
          }
          shoot() {
            name=$1; shift
            "$APP" --demo "$@" &
            pid=$!
            sleep 7
            screencapture -x "shots/$name.png" || true
            kill $pid || true
            sleep 2
          }
          # Fond d'ecran uni (s'il existe sur ce macOS)
          ls "/System/Library/Desktop Pictures/Solid Colors/" || true
          for wp in "Stone.png" "Silver.png" "Space Gray.png"; do
            f="/System/Library/Desktop Pictures/Solid Colors/$wp"
            if [ -f "$f" ]; then
              osascript -e "tell application \"System Events\" to tell every desktop to set picture to \"$f\"" || true
              break
            fi
          done
          BAR="--demo-items 0,2,3,4"
          # Series d'images pour les GIF : frames <nom> <nombre> <zone x,y,l,h> <arguments de demo...>
          frames() {
            name=$1; n=$2; region=$3; shift 3
            mkdir -p "shots/gif-$name"
            "$APP" --demo "$@" &
            pid=$!
            sleep 7
            for i in $(seq -w 1 $n); do
              screencapture -x -R "$region" "shots/gif-$name/$i.png" || true
              sleep 0.12
            done
            kill $pid || true
            sleep 2
          }
          if [ "${{ inputs.gifs }}" = "true" ]; then
            appearance true
            frames barre 50 "400,0,624,30" --demo-items 0,2,6,7 --demo-no-widgets
            [ -n "${ONLY_BAR:-}" ] || frames minuteur 30 "560,30,340,300" --demo-items 0,3,7 --demo-no-widgets --demo-card 2
            [ -n "${ONLY_BAR:-}" ] || frames sonnette 30 "600,30,424,350" $BAR --demo-no-widgets --demo-doorbell
            [ -n "${ONLY_BAR:-}" ] || frames panneau 24 "420,30,390,660" $BAR --demo-no-widgets --demo-panel
            appearance false
            frames barre-clair 50 "400,0,624,30" --demo-items 0,2,6,7 --demo-no-widgets
            ls -R shots | head -50
            exit 0
          fi
          for mode in clair sombre; do
            if [ $mode = clair ]; then appearance false; else appearance true; fi
            shoot "barre-$mode" $BAR
            shoot "carte-lumiere-$mode" $BAR --demo-card 0
            shoot "carte-thermostat-$mode" $BAR --demo-card 1
            shoot "carte-capteur-$mode" $BAR --demo-card 2
            shoot "carte-exterieur-$mode" $BAR --demo-card 3
            shoot "reglages-$mode" --demo-settings items
            shoot "ajout-$mode" --demo-picker
            shoot "widgets-$mode" $BAR
            shoot "panneau-$mode" $BAR --demo-no-widgets --demo-panel
            shoot "minuteur-$mode" --demo-items 0,3,7 --demo-no-widgets --demo-card 2
            shoot "panneau-assist-$mode" $BAR --demo-no-widgets --demo-panel --demo-search "allume_la_lumiere_du_salon" --demo-ask
            shoot "carte-personne-$mode" $BAR --demo-no-widgets --demo-card-entity person.alex
            shoot "carte-lecteur-$mode" $BAR --demo-no-widgets --demo-card-entity media_player.salon
            shoot "carte-camera-$mode" --demo-items 0,3,8 --demo-no-widgets --demo-card 2
            shoot "sonnette-$mode" $BAR --demo-no-widgets --demo-doorbell
            shoot "reglages-notifications-$mode" --demo-no-widgets --demo-settings notifications
            shoot "autocompletion-$mode" --demo-no-widgets --demo-autocomplete --demo-settings items
            shoot "tu-voulais-dire-$mode" --demo-no-widgets --demo-autocomplete --demo-settings notifications
            shoot "panneau-large-$mode" $BAR --demo-no-widgets --demo-panel --demo-panel-wide
            shoot "reglages-widgets-$mode" --demo-settings widgets
          done
          ls -l shots
      - uses: actions/upload-artifact@v4
        with:
          name: captures-macos
          path: shots/*.png
      - name: Envoi des captures brutes sur la branche
        if: inputs.commit && github.ref_name != 'main'
        run: |
          mkdir -p docs/screenshots/macos-brut
          cp -R shots/* docs/screenshots/macos-brut/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/macos-brut
          git commit -m "Captures macOS brutes (a recadrer)"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
